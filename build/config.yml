# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "ltcovalt" # The name of the company
  productName: "Code CAD Studio" # The name of the application
  productIdentifier: "com.ltcovalt.codecadstudio" # The unique product identifier
  description: "Local-first parametric 3D CAD GUI for build123d" # The application description
  copyright: "© 2026, Luke Covalt" # Copyright text
  comments: "Model-agnostic parametric GUI for build123d" # Comments
  version: "0.1.0" # The application version

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - examples
      - .venv
      - __pycache__
      - .pytest_cache
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
      - "test_*.py"
    watched_extension:
      - "*.go"
      - "*.py"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

# File Associations
# More information at: https://v3.wails.io/noit/done/yet
fileAssociations:
