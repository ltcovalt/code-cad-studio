<header class="navbar bg-base-200 border-b border-base-300 min-h-12 px-3 gap-2 shrink-0">
  <div class="flex-1 flex items-center gap-3 min-w-0">
    <div class="flex items-center gap-2 font-bold text-base tracking-tight">
      <span class="truncate">Code CAD Studio</span>
    </div>
    <span id="hot-reload-badge" class="badge badge-ghost badge-xs hidden">Reloaded</span>
  </div>

  <div class="flex-none flex items-center gap-1">
    <!-- Layout Switcher Dropdown -->
    <div class="dropdown dropdown-end" id="layout-dropdown">
      <div
        tabindex="0"
        role="button"
        id="layout-menu-btn"
        class="btn btn-ghost btn-sm btn-square"
        title="Layout view"
        aria-label="Layout view">
        <svg id="layout-menu-icon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <line x1="10" y1="4" x2="10" y2="20" />
          <line x1="3" y1="12" x2="10" y2="12" />
        </svg>
      </div>
      <ul tabindex="0" class="dropdown-content bg-base-300 rounded-box z-50 w-44 p-1.5 shadow-2xl border border-base-content/10 space-y-0.5">
        <li>
          <button
            type="button"
            data-layout-option="stacked"
            class="btn btn-xs btn-block btn-ghost justify-start gap-2 font-normal">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <line x1="10" y1="4" x2="10" y2="20" />
              <line x1="3" y1="12" x2="10" y2="12" />
            </svg>
            <span>Single Column</span>
          </button>
        </li>
        <li>
          <button
            type="button"
            data-layout-option="side-by-side"
            class="btn btn-xs btn-block btn-ghost justify-start gap-2 font-normal">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <line x1="8" y1="4" x2="8" y2="20" />
              <line x1="13" y1="4" x2="13" y2="20" />
            </svg>
            <span>Side by Side</span>
          </button>
        </li>
        <li>
          <button
            type="button"
            data-layout-option="right"
            class="btn btn-xs btn-block btn-ghost justify-start gap-2 font-normal">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <line x1="8" y1="4" x2="8" y2="20" />
              <line x1="16" y1="4" x2="16" y2="20" />
            </svg>
            <span>Right Parameters</span>
          </button>
        </li>
      </ul>
    </div>

    <div hx-get="/hx/theme-controller" hx-trigger="load" hx-swap="outerHTML"></div>

    <button
      type="button"
      class="btn btn-ghost btn-sm btn-square"
      title="Project &amp; Python Settings"
      aria-label="Settings"
      hx-get="/hx/settings"
      hx-target="#modal-container"
      hx-swap="innerHTML">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    </button>
  </div>
</header>
