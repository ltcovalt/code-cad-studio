<div class="dropdown dropdown-end" data-current-theme="{{.CurrentTheme}}">
  <div tabindex="0" role="button" class="btn btn-ghost btn-sm btn-square" title="Theme" aria-label="Theme">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
      <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
      <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
      <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
      <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z" />
    </svg>
  </div>
  <ul tabindex="0" class="dropdown-content bg-base-300 rounded-box z-50 w-36 p-1.5 shadow-2xl border border-base-content/10">
    {{$cur := .CurrentTheme}}
    <li><input type="radio" name="theme-dropdown" class="theme-controller btn btn-xs btn-block btn-ghost justify-start" aria-label="Dark" value="dark" {{if eq $cur "dark"}}checked{{end}} /></li>
    <li><input type="radio" name="theme-dropdown" class="theme-controller btn btn-xs btn-block btn-ghost justify-start" aria-label="Light" value="light" {{if eq $cur "light"}}checked{{end}} /></li>
    <li><input type="radio" name="theme-dropdown" class="theme-controller btn btn-xs btn-block btn-ghost justify-start" aria-label="Dracula" value="dracula" {{if eq $cur "dracula"}}checked{{end}} /></li>
    <li><input type="radio" name="theme-dropdown" class="theme-controller btn btn-xs btn-block btn-ghost justify-start" aria-label="Night" value="night" {{if eq $cur "night"}}checked{{end}} /></li>
    <li><input type="radio" name="theme-dropdown" class="theme-controller btn btn-xs btn-block btn-ghost justify-start" aria-label="Corporate" value="corporate" {{if eq $cur "corporate"}}checked{{end}} /></li>
    <li><input type="radio" name="theme-dropdown" class="theme-controller btn btn-xs btn-block btn-ghost justify-start" aria-label="Emerald" value="emerald" {{if eq $cur "emerald"}}checked{{end}} /></li>
    <li><input type="radio" name="theme-dropdown" class="theme-controller btn btn-xs btn-block btn-ghost justify-start" aria-label="Cupcake" value="cupcake" {{if eq $cur "cupcake"}}checked{{end}} /></li>
    <li><input type="radio" name="theme-dropdown" class="theme-controller btn btn-xs btn-block btn-ghost justify-start" aria-label="Retro" value="retro" {{if eq $cur "retro"}}checked{{end}} /></li>
  </ul>
</div>
